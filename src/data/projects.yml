- title: Subwoofer Redesign
  subtitle: A personal project to redesign a thrifted subwoofer.  
  status: active
  period: Summer 2026 — Present
  description: Design a new subwoofer PCB compatible with the existing enclosure of a Sony SA-WCT800 Active Subwoofer, that can connect via to an iPhone via Bluetooth.
  badges:
    - Microcontroller Programming
    - Schematic and Simulation Design
    - PCB Design
  highlights:
    - Designed a new PCB for the subwoofer using KiCAD, and implemented a Bluetooth audio receiver using a Raspberry Pi Pico.
    - Programmed the Pico to read button inputs, display specific LED states, and control the additional ICs (TPA3116D2 amplifier, and MH-M18 Bluetooth audio receiver) via GPIOs.
  tech:
    - Python
    - KiCAD
    - Raspberry Pi Pico
    - TPA3116D2 Amplifier
    - MH-M18 Bluetooth Audio Receiver
    - JLCPCB
  links:
    - label: Repository
      href: https://github.com/Will-Zimmermann/Subwoofer-Project.git

